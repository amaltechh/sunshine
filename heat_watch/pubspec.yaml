name: heat_watch
description: "Urban Heat Intelligence Platform - Mapping heat inequality and simulating interventions"
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # UI & Icons
  cupertino_icons: ^1.0.2
  google_fonts: ^6.0.0
  flutter_animate: ^4.2.0

  # Maps & Location
  flutter_map: ^6.1.0
  latlong2: ^0.9.0

  # Charts & Visualization
  fl_chart: ^0.65.0

  # State Management
  provider: ^6.1.0

  # Network & Data
  http: ^1.1.0
  shared_preferences: ^2.2.0

  # Utilities
  intl: ^0.18.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.13.1
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/images/logo.png"
  adaptive_icon_background: "#1A2416"
  adaptive_icon_foreground: "assets/images/logo.png"
